 Expand any row to edit its rhythm.</p><div id="rows"></div><button class="add" id="addBtn">＋ Add Row</button></main><div class="transport"><div><span id="position">Ready</span><div class="muted" id="status">Audio starts on play</div></div><button class="play" id="playBtn" aria-label="Play">▶</button><div class="tempo" id="tempoRead">120</div></div><div class="modal" id="modal" hidden><div class="dialog" id="dialog"></div></div><input id="file" type="file" accept="application/json,.json" hidden><script>
'use strict';
const $=s=>document.querySelector(s), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const makeRow=(beats=4)=>({id:crypto.randomUUID(),name:'Beat Pattern',beats,subdiv:1,tempo:120,endTempo:120,change:false,repeats:1,dots:Array.from({length:beats},()=>Array(1).fill(1)),expanded:false});
let state={name:'New Rhythm',curve:'linear',volume:.6,rows:[makeRow(4)]},audio=null,clicks=[],playing=false,interval=null,events=[],idx=0,epoch=0,lastUi=-1,scheduledUntil=0,session=0;
state.rows[0].dots[0][0]=2;
function cleanRow(r){r.beats=clamp(Math.round(+r.beats||4),1,20);r.subdiv=clamp(Math.round(+r.subdiv||1),1,5);r.tempo=clamp(+r.tempo||120,20,300);r.endTempo=clamp(+r.endTempo||r.tempo,20,300);r.repeats=clamp(Math.round(+r.repeats||1),1,32);r.dots=Array.from({length:r.beats},(_,i)=>Array.from({length:r.subdiv},(_,j)=>[0,1,2,3].includes(r.dots?.[i]?.[j])?r.dots[i][j]:1));}
function render(){let wrap=$('#rows');wrap.innerHTML='';state.rows.forEach((r,i)=>{cleanRow(r);const el=document.createElement('section');el.className='row'+(playing&&activeRow===i?' active':'');el.innerHTML=`<div class="rowtop"><button class="expand" data-act="expand" data-i="${i}">${r.expanded?'⌄':'›'}</button><div class="rowname">${escapeHTML(r.name)}</div><span class="mini">${r.beats} beats · ${r.subdiv} subdivisions · ${r.repeats}×</span><button class="icon" title="Move up" data-act="up" data-i="${i}">↑</button><button class="icon" title="Move down" data-act="down" data-i="${i}">↓</button><button class="icon" title="Delete row" data-act="delete" data-i="${i}">✕</button></div><div class="dots">${r.dots.map((b,bi)=>`<div class="beat" data-beat="${i}-${bi}">${b.map((v,si)=>`<button aria-label="Beat ${bi+1} subdivision ${si+1}" title="Beat ${bi+1}, subdivision ${si+1}" class="dot ${['mute','normal','accent','soft'][v]||'normal'}" data-act="dot" data-i="${i}" data-b="${bi}" data-s="${si}"></button>`).join('')}</div>`).join('')}</div>`;
if(r.expanded){const panel=document.createElement('div');panel.className='settings';panel.innerHTML=`<div class="field"><label>Pattern name</label><input type="text" data-field="name" data-i="${i}" value="${escapeHTML(r.name)}"></div>${step(i,'tempo','Tempo',r.tempo,1)}${step(i,'beats','Beats (1–20)',r.beats,1)}${step(i,'subdiv','Subdivisions (1–5)',r.subdiv,1)}${step(i,'repeats','Repeats (1–32)',r.repeats,1)}${step(i,'endTempo','End tempo',r.endTempo,1)}<label class="toggle"><input type="checkbox" data-field="change" data-i="${i}" ${r.change?'checked':''}> Change tempo over this row</label><div class="note">The end tempo is reached over all repeats of this row. Each row's starting tempo is independent.</div>`;el.append(panel)}wrap.append(el)});if(!playing)$('#tempoRead').textContent=state.rows[0]?.tempo||120;}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function step(i,f,label,v){return `<div class="field"><label>${label}</label><div class="stepper"><button data-act="step" data-i="${i}" data-field="${f}" data-d="-1">−</button><input type="number" data-field="${f}" data-i="${i}" value="${v}"><button data-act="step" data-i="${i}" data-field="${f}" data-d="1">+</button></div></div>`}
let activeRow=-1;
$('#rows').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const i=+b.dataset.i,r=state.rows[i],a=b.dataset.act;if(a==='dot'){const x=+b.dataset.b,y=+b.dataset.s;r.dots[x][y]=(r.dots[x][y]+1)%4;render()}else if(a==='expand'){r.expanded=!r.expanded;render()}else if(a==='delete'){if(state.rows.length===1)return alert('Keep at least one row.');stop();state.rows.splice(i,1);render()}else if(a==='up'||a==='down'){stop();let j=i+(a==='up'?-1:1);if(j<0||j>=state.rows.length)return;[state.rows[i],state.rows[j]]=[state.rows[j],state.rows[i]];render()}else if(a==='step'){let f=b.dataset.field,d=+b.dataset.d;r[f]=+r[f]+d;cleanRow(r);stop();render()}});
$('#rows').addEventListener('change',e=>{let x=e.target;if(!x.dataset.field)return;let r=state.rows[+x.dataset.i];r[x.dataset.field]=x.type==='checkbox'?x.checked:x.type==='number'?+x.value:x.value;cleanRow(r);stop();render()});
$('#addBtn').onclick=()=>{stop();let r=makeRow();r.expanded=true;state.rows.push(r);render();r&&window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};
function buildEvents(){const result=[];let t=0;state.rows.forEach((r,ri)=>{cleanRow(r);const count=r.beats*r.subdiv*r.repeats;for(let n=0;n<count;n++){let p=count===1?0:n/(count-1);let bpm=r.change?tempoAt(r.tempo,r.endTempo,p):r.tempo;let bi=Math.floor((n% (r.beats*r.subdiv))/r.subdiv),si=n%r.subdiv;result.push({t,ri,bi,si,bpm,type:r.dots[bi][si]});let delta=60/(bpm*r.subdiv);t+=delta;} });return {result,duration:t}}
function tempoAt(a,b,p){if(state.curve==='exponential'){return a+(b-a)*(p*p)}if(state.curve==='logarithmic'){return a+(b-a)*(Math.log1p(9*p)/Math.log(10))}return a+(b-a)*p}
async function ensureAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();clicks=[220,660,880].map(freq=>{let len=Math.round(audio.sampleRate*.045),buf=audio.createBuffer(1,len,audio.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++){let t=i/audio.sampleRate;data[i]=(Math.sin(2*Math.PI*freq*t)+.2*Math.sin(2*Math.PI*freq*2*t))*Math.exp(-t*95)}return buf})}await audio.resume();if(audio.state!=='running')throw Error('Audio context not running')}
function sound(ev,at){if(ev.type===0)return;let src=audio.createBufferSource(),gain=audio.createGain();src.buffer=clicks[ev.type===2?2:ev.type===3?0:1];gain.gain.value=state.volume*(ev.type===3?.32:ev.type===2?1:.72);src.connect(gain).connect(audio.destination);src.start(at)}
let cycle=0,cycleStart=0,duration=0;
function tick(){if(!playing||!audio||audio.state!=='running'){if(playing)stop('Audio interrupted');return}const now=audio.currentTime;let horizon=now+.13;let guard=0;while(playing&&guard++<1500){if(idx>=events.length){idx=0;cycle++;cycleStart+=duration}let ev=events[idx],when=cycleStart+ev.t;if(when>horizon)break;if(when>=now-.008)sound(ev,Math.max(when,now+.002));idx++}let elapsed=now-epoch;let within=((elapsed%duration)+duration)%duration;let j=binaryIndex(within);let ev=events[j];if(ev&&lastUi!==`${cycle}-${j}`){lastUi=`${cycle}-${j}`;activeRow=ev.ri;$('#tempoRead').textContent=Math.round(ev.bpm);$('#position').textContent=`Row ${ev.ri+1} · Beat ${ev.bi+1}`;document.querySelectorAll('.row').forEach((el,k)=>el.classList.toggle('active',k===ev.ri));document.querySelectorAll('.beat').forEach(el=>el.classList.remove('now'));document.querySelectorAll('.dot.playing').forEach(el=>el.classList.remove('playing'));let dot=document.querySelector(`[data-i="${ev.ri}"][data-b="${ev.bi}"][data-s="${ev.si}"]`);dot?.classList.add('playing');dot?.closest('.beat')?.classList.add('now')}}
function binaryIndex(t){let lo=0,hi=events.length-1;while(lo<hi){let m=Math.ceil((lo+hi)/2);if(events[m].t<=t)lo=m;else hi=m-1}return lo}
async function start(){try{await ensureAudio();let b=buildEvents();events=b.result;duration=b.duration;if(!events.length||!duration)throw Error('No rhythm');idx=0;cycle=0;lastUi=-1;epoch=audio.currentTime+.075;cycleStart=epoch;playing=true;$('#playBtn').textContent='■';$('#status').textContent='Playing';interval=setInterval(tick,25);tick()}catch(e){stop('Unable to start audio');alert(e.message)}}
function stop(reason='Stopped'){playing=false;clearInterval(interval);interval=null;activeRow=-1;$('#playBtn').textContent='▶';$('#position').textContent='Ready';$('#status').textContent=reason;document.querySelectorAll('.row').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.dot.playing').forEach(x=>x.classList.remove('playing'));document.querySelectorAll('.beat.now').forEach(x=>x.classList.remove('now'));$('#tempoRead').textContent=state.rows[0]?.tempo||120;if(audio){audio.close().catch(()=>{});audio=null;clicks=[]}}
$('#playBtn').onclick=()=>playing?stop():start();document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop('Paused while tab is hidden')});
function show(html){$('#dialog').innerHTML=html;$('#modal').hidden=false}function hide(){$('#modal').hidden=true}$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hide();if(e.code==='Space'&&['INPUT','BUTTON','SELECT','TEXTAREA'].indexOf(document.activeElement.tagName)<0){e.preventDefault();$('#playBtn').click()}});
$('#newBtn').onclick=()=>{if(!confirm('Start a new rhythm? Unsaved changes will be lost.'))return;stop();state={name:'New Rhythm',curve:'linear',volume:.6,rows:[makeRow()]};state.rows[0].dots[0][0]=2;render()};
const key='beatmatrix-library-v1';function library(){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}function saveLibrary(v){localStorage.setItem(key,JSON.stringify(v))}
$('#saveBtn').onclick=()=>show(`<h2>Save rhythm</h2><label>Name</label><input id="patternName" value="${escapeHTML(state.name)}"><button id="confirmSave">Save pattern</button> <button id="close">Cancel</button>`);
$('#libraryBtn').onclick=()=>{let l=library();show(`<h2>Saved patterns</h2>${Object.keys(l).length?Object.keys(l).map(n=>`<div class="saved"><span>${escapeHTML(n)}</span><span><button data-load="${encodeURIComponent(n)}">Load</button><button data-remove="${encodeURIComponent(n)}">Delete</button></span></div>`).join(''):'<p class="note">No saved patterns yet.</p>'}<button id="close">Close</button>`)};
$('#dialog').addEventListener('click',e=>{let b=e.target;if(b.id==='close'){hide()}else if(b.id==='confirmSave'){let name=$('#patternName').value.trim()||'Untitled';state.name=name;let l=library();l[name]=JSON.parse(JSON.stringify(state));saveLibrary(l);hide()}else if(b.dataset.load){let l=library();stop();state=validate(l[decodeURIComponent(b.dataset.load)]);hide();render()}else if(b.dataset.remove){let l=library();delete l[decodeURIComponent(b.dataset.remove)];saveLibrary(l);$('#libraryBtn').click()}else if(b.id==='saveSettings'){state.volume=+$('#volume').value;state.curve=$('#curve').value;stop();hide();render()}});
function validate(s){if(!s||!Array.isArray(s.rows)||!s.rows.length||s.rows.length>100)throw Error('Invalid pattern');let v={name:String(s.name||'Imported Rhythm').slice(0,120),curve:['linear','exponential','logarithmic'].includes(s.curve)?s.curve:'linear',volume:clamp(+s.volume||.6,.01,1),rows:s.rows.map(r=>({...makeRow(),...r,name:String(r.name||'Beat Pattern').slice(0,100),dots:Array.isArray(r.dots)?r.dots:[],expanded:false}))};v.rows.forEach(cleanRow);return v}
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(state.name.replace(/[^a-z0-9-]/gi,'-')||'beatmatrix')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let s=validate(JSON.parse(await f.text()));stop();state=s;render()}catch(err){alert('Could not import: '+err.message)}e.target.value=''};
$('#settingsBtn').onclick=()=>show(`<h2>Settings</h2><label>Volume</label><input id="volume" type="range" min="0.01" max="1" step="0.01" value="${state.volume}"><label>Tempo transition curve</label><select id="curve"><option value="linear" ${state.curve==='linear'?'selected':''}>Linear</option><option value="exponential" ${state.curve==='exponential'?'selected':''}>Exponential — slow start</option><option value="logarithmic" ${state.curve==='logarithmic'?'selected':''}>Logarithmic — fast start</option></select><p class="note">Tempo changes are calculated at every subdivision. Playback uses the Web Audio clock and a lookahead scheduler. Keep this tab visible during playback.</p><button id="saveSettings">Apply</button> <button id="close">Cancel</button>`);
render();
</script></body></html>
